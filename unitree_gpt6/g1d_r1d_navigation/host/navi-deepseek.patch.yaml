# host/navi-deepseek.patch.yaml -- official DeepSeek API as the "brain".
#
# Same mechanism as navi-bailian.patch.yaml: a top-level override of the llm-deepseek row mounted by dsh-base.
# Key: env var DEEPSEEK_API_KEY. The endpoint defaults to official DeepSeek; for a self-hosted/relay gateway,
# export DEEPSEEK_BASE_URL=<gateway URL> before launch (read by the adapter at runtime; no edit needed here).
#
# Note: driving the robot requires a model with image input. The text-only models below (v4-flash / v4-pro)
# cannot see the camera and are for comparison only; put a vision model available on your account into
# <your-vision-model> (with inputModalities: [text, image]).

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxImagesPerRequest: 4
    imageOffloadCountQuantum: 1
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
      - id: <your-vision-model>
        name: DeepSeek Vision
        contextWindow: 131072
        inputModalities: [text, image]
        imagePixelBudget: 640000
